aid: sherpa
name: sherpa
description: >-
  sherpa is an AI operating system for External Workforce Management (EWM) that runs an
  enterprise's contingent-labor program end to end with autonomous agents, replacing the
  work traditionally done by a VMS (Vendor Management System) and MSP (Managed Service
  Provider). Its agents cover every phase of an external engagement: autonomous intake and
  classification from Slack, email, Teams or voice; collaborative scope, role and budget
  drafting; autonomous sourcing with market-benchmarked rates and ranked candidates and
  suppliers; coordinated screening interviews scored against a weighted rubric; autonomous
  hiring and onboarding (documents, background and compliance checks, contracts, provisioning,
  hardware and badges); and active management and payment with a dedicated PM agent, live spend
  visibility and flexible payouts once outcomes are verified. One platform spans every worker
  type — contingent labor, freelancers / independent contractors (with a built-in Agent of
  Record), SOW / services engagements, and, coming soon, AI agents as a managed worker type —
  with rate intelligence, compliance management and analytics built in. sherpa launched out of
  stealth with a $2.2M pre-seed round and is backed by Seedcamp and Y Combinator.
